[pytest]
# Run from the repo root:  pytest -q
testpaths = tests
addopts = -ra

# Third-party deprecation noise we don't control (langchain-community sunset,
# the HuggingFaceEmbeddings move). Our own code is migrated separately — see
# the "langchain-community migration" note in CLAUDE.md.
filterwarnings =
    ignore:.*langchain-community.*is being sunset.*:DeprecationWarning
    ignore:.*HuggingFaceEmbeddings.*:DeprecationWarning
